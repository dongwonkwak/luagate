name: Frontend Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'ui/**'
              - '.github/workflows/frontend-*.yml'

  quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run format:check
        working-directory: ui
      - run: npm run build
        working-directory: ui

  frontend-quality-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, quality]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.detect-changes.result }}" == "failure" ]]; then
            echo "detect-changes failed"
            exit 1
          fi
          if [[ "${{ needs.quality.result }}" == "failure" || "${{ needs.quality.result }}" == "cancelled" ]]; then
            echo "quality check failed or cancelled"
            exit 1
          fi
