name: MCP Server Tests

on:
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/test-mcp.yml"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.changes.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mcp:
              - 'mcp/**'
              - '.github/workflows/test-mcp.yml'

  unit-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true'
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test

  integration-test:
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test]
    if: needs.detect-changes.outputs.mcp == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        run: |
          docker compose -f mcp/tests/integration/docker-compose.yml up \
            --build --abort-on-container-exit --exit-code-from mcp-test-runner

  mcp-test-status:
    runs-on: ubuntu-latest
    needs: [detect-changes, unit-test, integration-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "detect-changes failed or was cancelled"
            exit 1
          fi
          if [ "${{ needs.detect-changes.outputs.mcp }}" != "true" ]; then
            echo "No MCP changes detected — skipping"
            exit 0
          fi
          if [ "${{ needs.unit-test.result }}" != "success" ]; then
            echo "MCP unit tests failed"
            exit 1
          fi
          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "MCP integration tests failed"
            exit 1
          fi
          echo "All MCP tests passed"
