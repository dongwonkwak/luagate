# ── integration-test.yml ───────────────────────────────────────────────────
# GitHub Actions: Docker 기반 Test::Nginx 통합 테스트
# DON-133: make test-docker 호출 — OpenResty + Test::Nginx 컨테이너 실행
#
# 트리거:
#   - main 브랜치 push
#   - PR (모든 브랜치)
# ───────────────────────────────────────────────────────────────────────────

name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-docker:
    name: Test::Nginx (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t luagate-test .

      - name: Run integration tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/lua/luagate:/usr/local/openresty/lualib/luagate:ro" \
            -v "${{ github.workspace }}/conf/nginx.conf:/luagate/conf/nginx.conf:ro" \
            -v "${{ github.workspace }}/tests:/luagate/tests:ro" \
            -v "${{ github.workspace }}/policies:/luagate/policies:ro" \
            -e TEST_NGINX_SERVROOT=/tmp/nginx-test-servroot \
            luagate-test \
            prove -r -v tests/integration/http/
        # docker run의 non-zero exit code가 step 실패로 전파됨
