# ── integration-test.yml ───────────────────────────────────────────────────
# GitHub Actions: Docker 기반 Test::Nginx 통합 테스트
# DON-133: make test-docker 호출 — OpenResty + Test::Nginx 컨테이너 실행
#
# 트리거:
#   - main 브랜치 push
#   - PR (모든 브랜치)
# ───────────────────────────────────────────────────────────────────────────

name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-docker:
    name: Test::Nginx (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: pipeline_spec
            prove_args: -v tests/integration/http/pipeline_spec.t
            port: 1984
            servroot: /tmp/nginx-test-servroot-pipeline
            compose_project: luagate-pipeline
          - name: test_nginx_basic
            prove_args: -v tests/integration/http/test_nginx_basic.t
            port: 1985
            servroot: /tmp/nginx-test-servroot-basic
            compose_project: luagate-basic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cached test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          tags: luagate-test:gha
          load: true
          cache-from: type=gha,scope=integration-test
          cache-to: type=gha,mode=max,scope=integration-test

      - name: Run integration tests via make test-docker
        run: >
          make test-docker
          DOCKER_COMPOSE_TEST_FLAGS=--no-build
          TEST_HTTP_PROVE_ARGS="${{ matrix.shard.prove_args }}"
          TEST_NGINX_PORT=${{ matrix.shard.port }}
          TEST_NGINX_SERVROOT=${{ matrix.shard.servroot }}
          COMPOSE_PROJECT_NAME=${{ matrix.shard.compose_project }}
        env:
          LUAGATE_TEST_IMAGE: luagate-test:gha
        # make test-docker: shard별 Compose 실행 + EXIT_CODE 전파 (이미지는 선행 빌드 결과 재사용)

  test-docker-compat:
    name: Test::Nginx (Docker)
    runs-on: ubuntu-latest
    needs: test-docker
    if: ${{ always() }}

    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test-docker.result }}" != "success" ]; then
            echo "HTTP integration shards did not all succeed."
            exit 1
          fi
