name: Update PROGRESS.md on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: progress-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-progress:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and append progress entry
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TEMPLATE_ROW='| YYYY-MM-DD | DON-XX | 설명 | `경로` | 비고 |'

          # Extract <!-- PROGRESS ... --> block from PR body
          ENTRY=$(printf '%s\n' "$PR_BODY" | sed -n '/^<!-- PROGRESS$/,/^-->$/p' | grep '^|' || true)
          ENTRY=$(printf '%s\n' "$ENTRY" | grep -Fvx "$TEMPLATE_ROW" || true)

          if [ -z "$ENTRY" ]; then
            echo "No filled PROGRESS entries found in PR body — skipping"
            echo "has_entry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_entry=true" >> "$GITHUB_OUTPUT"

          # Append to PROGRESS.md table
          echo "$ENTRY" >> PROGRESS.md

      - name: Create PR for PROGRESS.md update
        if: steps.extract.outputs.has_entry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="auto/progress-pr-${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add PROGRESS.md
          git commit -m "docs(progress): auto-append entry from PR #${PR_NUMBER}"
          git push origin "$BRANCH"

          gh pr create \
            --title "docs(progress): auto-append entry from PR #${PR_NUMBER}" \
            --body "PROGRESS.md 자동 갱신 (PR #${PR_NUMBER} 머지 시 트리거)" \
            --base main \
            --head "$BRANCH"

          # Fail the workflow if the follow-up PR cannot be queued for auto-merge.
          gh pr merge "$BRANCH" --auto --squash
