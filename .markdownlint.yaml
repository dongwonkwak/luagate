# markdownlint configuration
# https://github.com/DavidAnson/markdownlint

default: true

# MD013 — line length: disabled (long URLs / tables)
MD013: false

# MD033 — inline HTML: allow in docs
MD033:
  allowed_elements:
    - details
    - summary
    - br
    - img
    - div
    - strong

# MD041 — first line should be top-level heading
# README uses centered div hero, but other docs should have headings
# README disables this via inline <!-- markdownlint-disable MD041 -->
MD041: true

# MD036 — emphasis as heading
# README hero uses bold tagline, but other docs should follow this rule
# README disables this via inline <!-- markdownlint-disable MD036 -->
MD036: true

# MD024 — no duplicate headings within a section (siblings allowed)
MD024:
  siblings_only: true

# MD007 — unordered list indent: 2 spaces
MD007:
  indent: 2

# MD031/MD032 — allow tighter docs layout used in specs/ADR files
MD031: false
MD032: false

# MD040 — many spec snippets intentionally omit an info string
MD040: false

# MD060 — project tables use compact pipe formatting
MD060: false
