<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .text-main { fill: #e2e8f0; }
        .text-sub { fill: #94a3b8; }
      }
    </style>
  </defs>
  <!-- Shield/Gate icon -->
  <g transform="translate(20, 10)">
    <!-- Shield outline -->
    <path d="M40 8 L68 20 L68 52 C68 72 54 88 40 96 C26 88 12 72 12 52 L12 20 Z"
          fill="none" stroke="#1e3a5f" stroke-width="3.5"/>
    <!-- Gate bars -->
    <line x1="30" y1="35" x2="30" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="40" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="35" x2="50" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <!-- Gate top arch -->
    <path d="M25 38 Q40 22 55 38" fill="none" stroke="#1e3a5f" stroke-width="2.5"/>
    <!-- Lock circle -->
    <circle cx="40" cy="78" r="6" fill="#1e3a5f"/>
    <rect x="37" y="76" width="6" height="7" rx="1" fill="#f59e0b"/>
  </g>
  <!-- LuaGate text -->
  <text x="110" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="42" font-weight="700" letter-spacing="-0.5">
    <tspan class="text-main" fill="#1e3a5f">Lua</tspan><tspan fill="#f59e0b">Gate</tspan>
  </text>
  <!-- Tagline -->
  <text x="112" y="85" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13" class="text-sub" fill="#64748b" letter-spacing="0.3">
    Policy-Driven API Security Gateway
  </text>
  <!-- Tech badges -->
  <text x="112" y="105" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#94a3b8" letter-spacing="0.2">
    OpenResty + LuaJIT + Rust FFI
  </text>
</svg>
