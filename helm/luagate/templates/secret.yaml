{{- if not .Values.adminToken }}
{{- fail "adminToken is required. Set via --set adminToken=<token>. LuaGate refuses to start without it (fail-closed)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "luagate.fullname" . }}
  labels:
    {{- include "luagate.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ .Values.adminToken | b64enc | quote }}
