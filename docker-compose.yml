services:
  luagate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luagate
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9090:9090"   # Admin API
    volumes:
      # Mount only our app subdir — keeps OpenResty's bundled resty/* intact
      - ./lua/luagate:/usr/local/openresty/lualib/luagate:ro
      # Mount specific config file, not the whole conf/ dir
      - ./conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./policies:/etc/luagate/policies:ro
      - ./policies/luagate.yaml:/conf/policies.yaml:ro
      - ./conf/scanner-patterns:/conf/scanner-patterns:ro
    environment:
      - LUAGATE_ENV=development
      - LUAGATE_ADMIN_TOKEN=${LUAGATE_ADMIN_TOKEN:?Set LUAGATE_ADMIN_TOKEN in .env or environment}
      - LD_LIBRARY_PATH=/usr/local/openresty/lualib
    depends_on:
      - upstream-mock
    networks:
      - luagate-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  upstream-mock:
    image: nginx:1.25-alpine
    container_name: upstream-mock
    volumes:
      - ./tests/fixtures:/usr/share/nginx/html:ro
    networks:
      - luagate-net
    restart: unless-stopped

  # ── Observability (dev only) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: luagate-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./conf/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./conf/alerts.yml:/etc/prometheus/alerts.yml:ro
    environment:
      - LUAGATE_ADMIN_TOKEN=${LUAGATE_ADMIN_TOKEN:?Set LUAGATE_ADMIN_TOKEN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /run/secrets
        chmod 0700 /run/secrets
        printf '%s\n' "$$LUAGATE_ADMIN_TOKEN" > /run/secrets/admin_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
    networks:
      luagate-net:
        ipv4_address: 172.29.0.10
    depends_on:
      - luagate
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: luagate-alertmanager
    ports:
      - "9093:9093"
    networks:
      - luagate-net
    restart: unless-stopped

networks:
  luagate-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
