# LuaGate example policy — minimal working configuration
# Used for cold-start testing and Quick Start demos.
#
# Evaluation order: rules are evaluated by priority (lower = higher precedence).
# First matching rule wins. If no rule matches, global.default_action applies.
# Schema: flat top-level keys (rules / stream_rules) per policy-engine.md §2.0.

version: "1"

global:
  default_action: allow   # allow | deny
  log_level: info

rules:
  - id: allow-admin-internal-10
    description: "Allow /admin from 10.0.0.0/8 (RFC1918 Class A)"
    priority: 10
    scope:
      path: /admin/*
      src_ip_cidr: "10.0.0.0/8"
    action: allow
    tags: [admin]

  - id: allow-admin-internal-172
    description: "Allow /admin from 172.16.0.0/12 (RFC1918 Class B, includes Docker 172.29.x)"
    priority: 11
    scope:
      path: /admin/*
      src_ip_cidr: "172.16.0.0/12"
    action: allow
    tags: [admin]

  - id: allow-admin-internal-192
    description: "Allow /admin from 192.168.0.0/16 (RFC1918 Class C)"
    priority: 12
    scope:
      path: /admin/*
      src_ip_cidr: "192.168.0.0/16"
    action: allow
    tags: [admin]

  - id: block-admin-external
    description: "Block /admin from all other sources (IPv4 and IPv6)"
    priority: 20
    scope:
      path: /admin/*
    action: deny
    tags: [admin, security]

  - id: allow-health
    description: "Always allow health-check endpoint (no auth, no rate-limit)"
    priority: 100
    scope:
      path: /health
    action: allow
    tags: [ops]

stream_rules:
  - id: allow-internal-db-10
    description: "Allow DB from 10.0.0.0/8 (RFC1918 Class A)"
    priority: 10
    scope:
      dst_port: 5432
      src_ip_cidr: "10.0.0.0/8"
    action: proxy
    upstream: "postgres:5432"
    tags: [database]

  - id: allow-internal-db-172
    description: "Allow DB from 172.16.0.0/12 (RFC1918 Class B, includes Docker 172.29.x)"
    priority: 11
    scope:
      dst_port: 5432
      src_ip_cidr: "172.16.0.0/12"
    action: proxy
    upstream: "postgres:5432"
    tags: [database]

  - id: allow-internal-db-192
    description: "Allow DB from 192.168.0.0/16 (RFC1918 Class C)"
    priority: 12
    scope:
      dst_port: 5432
      src_ip_cidr: "192.168.0.0/16"
    action: proxy
    upstream: "postgres:5432"
    tags: [database]

  - id: deny-external-db
    description: "Deny DB connections from all other source networks"
    priority: 20
    scope:
      dst_port: 5432
    action: deny
    tags: [security]
