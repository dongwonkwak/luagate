worker_processes auto;
worker_shutdown_timeout 30s;
error_log  /dev/stderr warn;
pid        /var/run/openresty.pid;

# OpenResty: env 지시자 없이는 os.getenv()가 nil 반환
# admin-auth-contract.md §_token_source: LUAGATE_ADMIN_TOKEN 환경변수 사용
env LUAGATE_ADMIN_TOKEN;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    # 버전 정보 노출 차단 (Server 헤더, 에러 페이지)
    server_tokens off;

    # ── Lua 설정 ────────────────────────────────────────────────────────
    lua_code_cache on;
    lua_package_path  '/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/luagate/?.lua;;';
    lua_package_cpath '/usr/local/openresty/lualib/?.so;;';

    # ── Shared Dict Zones ────────────────────────────────────────────────
    # OpenResty: http 블록에 선언된 zone은 stream 컨텍스트에서도 접근 가능
    # stream 블록에 중복 선언하면 충돌 발생 → 모두 http 블록에 선언
    lua_shared_dict luagate_policy          10m;
    lua_shared_dict luagate_metrics          5m;
    lua_shared_dict luagate_stream_metrics   2m;
    lua_shared_dict luagate_connections      1m;
    lua_shared_dict luagate_state            1m;
    lua_shared_dict luagate_rate_limit       2m;
    lua_shared_dict luagate_admin_ratelimit  1m;

    # ── 초기화 (서버 기동 시 1회) ────────────────────────────────────────
    init_by_lua_block {
        require("luagate.policy.loader").init_load("conf/policies.yaml")
        local scanner_ok, scanner_err = require("luagate.scanner.ffi").init("conf/scanner-patterns")
        if not scanner_ok then
            ngx.log(ngx.ERR, "[luagate] scanner init failed: ", tostring(scanner_err))
            -- fail-closed: prevent nginx startup if scanner init fails
            error("[luagate] scanner init failed: " .. tostring(scanner_err))
        end
        -- Admin auth init: fail-closed if LUAGATE_ADMIN_TOKEN not set (DON-145)
        require("luagate.admin.auth").init()
    }

    # ── Nginx 변수 선언 (log_format에서 사용) ───────────────────────────
    # X-Request-ID 헤더가 있으면 그대로 사용, 없으면 $request_id
    map $http_x_request_id $luagate_request_id {
        default  $request_id;
        ~^.+$    $http_x_request_id;
    }

    map $request_uri $luagate_path_raw_default {
        ~^([^?]*) $1;
        default   $uri;
    }

    # ── 구조화 JSON 액세스 로그 ─────────────────────────────────────────
    # log/http.lua (log_by_lua)가 cjson.encode()로 완성된 JSON 한 줄을
    # $luagate_log_json에 저장한다. escape=json 중복 적용 금지 (log-schema.md §2, §8).
    log_format luagate_json '$luagate_log_json';

    access_log /dev/stdout luagate_json;

    # ── Upstream ─────────────────────────────────────────────────────────
    upstream luagate_upstream {
        server 127.0.0.1:9999;   # 로컬 테스트/개발용 기본값
        keepalive 32;
    }

    # ── 데이터 플레인 서버 (:8080) ───────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Nginx 변수 기본값 초기화 (nginx_core short-circuit에서도 27필드 채움)
        # rewrite_by_lua가 실행되면 실제 값으로 override된다 (http-pipeline.md §3).
        set $luagate_path_raw        $luagate_path_raw_default;
        set $luagate_path_normalized $uri;
        set $luagate_action          "allow";
        set $luagate_matched_rule    "null";
        set $luagate_decision_source "nginx_core";
        set $luagate_threat_type     "null";
        set $luagate_rule_name       "null";
        set $luagate_active_version  "none";
        set $luagate_request_state   "short_circuited";
        set $luagate_deny_reason     "null";
        set $luagate_threat_score    "null";
        set $luagate_worker_id       "0";
        set $luagate_src_ip          $remote_addr;
        set $luagate_query_string    $args;
        # nginx_core short-circuit(400/413/414) 또는 log_by_lua 미실행 경로에서도
        # access_log 스키마가 깨지지 않도록 27필드 fallback JSON을 유지한다.
        set $luagate_log_json        '{"timestamp":"$time_iso8601","request_id":"$luagate_request_id","src_ip":"$remote_addr","src_port":$remote_port,"dst_port":$server_port,"method":"$request_method","host":"","path_raw":"","path_normalized":"","query_string":"","http_version":"$server_protocol","user_agent":null,"content_length":null,"action":"$luagate_action","matched_rule_id":null,"deny_reason":null,"decision_source":"$luagate_decision_source","threat_type":null,"threat_score":null,"rule_name":null,"request_state":"$luagate_request_state","latency_ms":0,"upstream_latency_ms":null,"response_status":$status,"bytes_sent":$bytes_sent,"active_version":"$luagate_active_version","worker_id":$luagate_worker_id}';

        # 헬스체크 (정책 평가 없이 즉시 응답)
        location /health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local policy_ver = ngx.shared.luagate_policy:get("http:active_version") or "none"
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"status":"ok","policy_version":"' .. policy_ver .. '"}')
            }
        }

        location / {
            # ── 1. URL 정규화 (rewrite phase) ──────────────────────────
            rewrite_by_lua_block {
                require("luagate.http.handler").rewrite()
            }

            # ── 2. 정책 평가 (access phase) ────────────────────────────
            access_by_lua_block {
                require("luagate.http.handler").access()
            }

            # ── 3. 업스트림 프록시 ─────────────────────────────────────
            proxy_pass         http://luagate_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # $proxy_add_x_forwarded_for 대신 $remote_addr 직접 설정:
            # 클라이언트가 XFF 헤더를 주입해도 업스트림에서 신뢰할 수 없는 IP를 신뢰하지 않도록 방어.
            # ADR-004 §6.3b: XFF 헤더 조작 위협 완화.
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Request-ID      $luagate_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # ── 4. 로그 + 메트릭 (log phase) ──────────────────────────
            log_by_lua_block {
                require("luagate.http.handler").log_phase()
            }
        }
    }

    # ── Admin API 서버 (:9090) ───────────────────────────────────────────
    # ADR-004: 별도 server block으로 분리 — data plane 정책 평가 제외
    # ADR-004 §6.1: localhost 전용 바인딩 — 외부 네트워크 노출 금지
    server {
        listen 127.0.0.1:9090;
        server_name _;

        set $luagate_path_raw        $luagate_path_raw_default;
        set $luagate_path_normalized $uri;
        set $luagate_action          "allow";
        set $luagate_matched_rule    "null";
        set $luagate_decision_source "nginx_core";
        set $luagate_threat_type     "null";
        set $luagate_rule_name       "null";
        set $luagate_active_version  "none";
        set $luagate_request_state   "short_circuited";
        set $luagate_deny_reason     "null";
        set $luagate_threat_score    "null";
        set $luagate_worker_id       "0";
        set $luagate_src_ip          $remote_addr;
        set $luagate_query_string    $args;
        # nginx_core short-circuit(400/413/414) 또는 log_by_lua 미실행 경로에서도
        # access_log 스키마가 깨지지 않도록 27필드 fallback JSON을 유지한다.
        set $luagate_log_json        '{"timestamp":"$time_iso8601","request_id":"$luagate_request_id","src_ip":"$remote_addr","src_port":$remote_port,"dst_port":$server_port,"method":"$request_method","host":"","path_raw":"","path_normalized":"","query_string":"","http_version":"$server_protocol","user_agent":null,"content_length":null,"action":"$luagate_action","matched_rule_id":null,"deny_reason":null,"decision_source":"$luagate_decision_source","threat_type":null,"threat_score":null,"rule_name":null,"request_state":"$luagate_request_state","latency_ms":0,"upstream_latency_ms":null,"response_status":$status,"bytes_sent":$bytes_sent,"active_version":"$luagate_active_version","worker_id":$luagate_worker_id}';

        # ADR-004 §6.3b 강화 옵션 2: Nginx 레벨 IP allowlist
        allow 127.0.0.1;
        deny  all;

        # 보안 헤더 (security-patterns.md §보안 헤더 규칙, DON-174)
        # CSP: Monaco Editor Web Worker를 위해 worker-src 'self' blob: 필수
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:9090; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=()" always;
        add_header Cache-Control          "no-store" always;

        # ── Dashboard UI (DON-165) ─────────────────────────────────────
        # Build: `make ui-build` outputs to ui/dist/
        # Docker: Dockerfile COPY or volume mount maps ui/dist/ -> /etc/luagate/ui/dist
        # Dev: use `make ui-dev` (Vite dev server) or symlink ui/dist -> /etc/luagate/ui/dist
        location /dashboard {
            alias /etc/luagate/ui/dist;
            try_files $uri $uri/ /dashboard/index.html;
        }

        # All admin routes dispatched by router.lua (DON-146)
        # auth.verify() is called inside dispatch(), handling /health exemption
        location / {
            default_type application/json;
            content_by_lua_block {
                require("luagate.admin.router").dispatch()
            }
        }
    }
}

# ── Stream 블록 (TCP 프록시) ──────────────────────────────────────────────
stream {
    # lua_shared_dict는 http 블록에 선언 — stream에서 중복 선언 불필요

    lua_package_path  '/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/luagate/?.lua;;';
    lua_package_cpath '/usr/local/openresty/lualib/?.so;;';

    log_format stream_json '$luagate_stream_log_json';
    access_log /dev/stdout stream_json;

    upstream luagate_stream_upstream {
        server 127.0.0.1:9999;
    }

    # Resolver for dynamic proxy_pass with $luagate_upstream variable.
    # proxy_pass with a variable requires a resolver to resolve hostnames at runtime.
    # Adjust to your environment's DNS server (Docker: 127.0.0.11, systemd-resolved: 127.0.0.53).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8443;

        # Nginx variables for stream logging and handler communication
        set $luagate_conn_id         "";
        set $luagate_protocol        "raw";
        set $luagate_sni             "";
        set $luagate_stream_action   "deny";
        set $luagate_matched_rule    "";
        set $luagate_decision_source "nginx_core";
        set $luagate_active_version  "none";
        set $luagate_upstream        "";
        set $luagate_request_state   "short_circuited";
        set $luagate_worker_id       "0";
        # Fallback JSON for stream access_log: ensures valid 18-field schema
        # even when log_by_lua is not executed (preread deny, early close).
        set $luagate_stream_log_json '{"timestamp":"$time_iso8601","connection_id":"$luagate_conn_id","src_ip":"$remote_addr","src_port":$remote_port,"dst_port":$server_port,"detected_protocol":"$luagate_protocol","sni":null,"action":"$luagate_stream_action","matched_rule_id":null,"decision_source":"$luagate_decision_source","active_version":"$luagate_active_version","upstream":null,"session_duration_ms":0,"bytes_sent":0,"bytes_received":0,"upstream_connect_time_ms":null,"request_state":"$luagate_request_state","worker_id":$luagate_worker_id}';

        # Timeouts (stream-pipeline.md §10)
        preread_timeout       5s;
        proxy_connect_timeout 5s;
        proxy_timeout         300s;

        preread_by_lua_block {
            local handler = require("luagate.stream.handler")
            handler.preread()
        }

        proxy_pass $luagate_upstream;

        log_by_lua_block {
            -- 1. Stream session log (18-field JSON)
            local ok, err = pcall(function()
                require("luagate.log.stream").finalize()
            end)
            if not ok then
                ngx.log(ngx.ERR, "[luagate-stream] log finalize error: ", tostring(err))
            end
            -- 2. Metrics update
            local ok2, err2 = pcall(function()
                require("luagate.log.stream_metrics").collect()
            end)
            if not ok2 then
                ngx.log(ngx.ERR, "[luagate-stream] metrics error: ", tostring(err2))
            end
            -- 3. Decrement active_stream counter (existing logic)
            local conn_dict = ngx.shared.luagate_connections
            if conn_dict then
                local ok3, err3 = conn_dict:incr("active_stream", -1, 0)
                if not ok3 then
                    ngx.log(ngx.WARN, "[luagate-stream] failed to decr active_stream: ", tostring(err3))
                end
            end
        }
    }
}
