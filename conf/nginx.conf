worker_processes auto;
error_log  /dev/stderr warn;
pid        /var/run/openresty.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    # 버전 정보 노출 차단 (Server 헤더, 에러 페이지)
    server_tokens off;

    # ── Lua 설정 ────────────────────────────────────────────────────────
    lua_code_cache on;
    lua_package_path  '/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/luagate/?.lua;;';
    lua_package_cpath '/usr/local/openresty/lualib/?.so;;';

    # ── Shared Dict Zones (http context) ────────────────────────────────
    lua_shared_dict luagate_policy       10m;
    lua_shared_dict luagate_metrics       5m;
    lua_shared_dict luagate_connections   1m;
    lua_shared_dict luagate_state         1m;
    lua_shared_dict luagate_rate_limit    2m;

    # ── 초기화 (서버 기동 시 1회) ────────────────────────────────────────
    init_by_lua_block {
        -- Phase 1 stub: policy loader + FFI init in DON-98+
    }

    # ── Nginx 변수 선언 (log_format에서 사용) ───────────────────────────
    # X-Request-ID 헤더가 있으면 그대로 사용, 없으면 $request_id
    map $http_x_request_id $luagate_request_id {
        default  $request_id;
        ~^.+$    $http_x_request_id;
    }

    # ── 구조화 JSON 액세스 로그 ─────────────────────────────────────────
    log_format luagate_json escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"request_id":"$luagate_request_id",'
            '"src_ip":"$remote_addr",'
            '"src_port":$remote_port,'
            '"dst_port":$server_port,'
            '"method":"$request_method",'
            '"host":"$host",'
            '"path_raw":"$uri",'
            '"query_string":"$args",'
            '"status":$status,'
            '"action":"$luagate_action",'
            '"decision_source":"$luagate_decision_source",'
            '"matched_rule":$luagate_matched_rule,'
            '"threat_type":$luagate_threat_type,'
            '"active_version":"$luagate_active_version",'
            '"upstream_rt":"$upstream_response_time",'
            '"bytes_sent":$bytes_sent'
        '}';

    access_log /dev/stdout luagate_json;

    # ── Upstream ─────────────────────────────────────────────────────────
    upstream luagate_upstream {
        server 127.0.0.1:9999;   # 로컬 테스트/개발용 기본값
        keepalive 32;
    }

    # ── 데이터 플레인 서버 (:8080) ───────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Nginx 변수 기본값 초기화 (nginx_core short-circuit에서도 로그 필드 채움)
        set $luagate_action          "allow";
        set $luagate_matched_rule    "null";
        set $luagate_decision_source "nginx_core";
        set $luagate_threat_type     "null";
        set $luagate_rule_name       "null";
        set $luagate_active_version  "none";

        # 헬스체크 (정책 평가 없이 즉시 응답)
        location /health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local policy_ver = ngx.shared.luagate_policy:get("http:active_version") or "none"
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"status":"ok","policy_version":"' .. policy_ver .. '"}')
            }
        }

        location / {
            # ── 1. URL 정규화 (rewrite phase) ──────────────────────────
            rewrite_by_lua_block {
                -- Nginx 변수 기본값 선할당 (http-pipeline.md §3)
                ngx.var.luagate_decision_source = "nginx_core"
                ngx.var.luagate_action          = "allow"
                ngx.var.luagate_matched_rule    = "null"
                ngx.var.luagate_threat_type     = "null"
                ngx.var.luagate_rule_name       = "null"
                -- active_version 스냅샷 (요청 시작 시점)
                local ver = ngx.shared.luagate_policy:get("http:active_version")
                ngx.var.luagate_active_version = ver or "none"
                -- ngx.ctx 초기화
                ngx.ctx.luagate = {
                    request_id       = ngx.var.luagate_request_id,
                    path_raw         = ngx.var.uri,
                    path_normalized  = ngx.var.uri,  -- stub: decoder in DON-98+
                    query_raw        = ngx.var.args or "",
                    query_normalized = ngx.var.args or "",
                    action           = "allow",
                    decision_source  = "nginx_core",
                    active_version   = ver or "none",
                    start_time_ms    = ngx.now() * 1000,
                }
            }

            # ── 2. 정책 평가 (access phase) ────────────────────────────
            access_by_lua_block {
                -- Policy evaluation stub (DON-98+)
                -- 현재: 모든 요청 allow, decision_source = policy_engine
                ngx.var.luagate_decision_source = "policy_engine"
                ngx.var.luagate_action          = "allow"
                if ngx.ctx.luagate then
                    ngx.ctx.luagate.decision_source = "policy_engine"
                end
            }

            # ── 3. 업스트림 프록시 ─────────────────────────────────────
            proxy_pass         http://luagate_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # $proxy_add_x_forwarded_for 대신 $remote_addr 직접 설정:
            # 클라이언트가 XFF 헤더를 주입해도 업스트림에서 신뢰할 수 없는 IP를 신뢰하지 않도록 방어.
            # ADR-004 §6.3b: XFF 헤더 조작 위협 완화.
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Request-ID      $luagate_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # ── 4. 로그 + 메트릭 (log phase) ──────────────────────────
            log_by_lua_block {
                -- Metrics update stub (DON-98+)
                -- 예: ngx.shared.luagate_metrics:incr("req:total", 1)
            }
        }
    }

    # ── Admin API 서버 (:9090) ───────────────────────────────────────────
    # ADR-004: 별도 server block으로 분리 — data plane 정책 평가 제외
    # ADR-004 §6.1: localhost 전용 바인딩 — 외부 네트워크 노출 금지
    server {
        listen 127.0.0.1:9090;
        server_name _;

        # ADR-004 §6.3b 강화 옵션 2: Nginx 레벨 IP allowlist
        allow 127.0.0.1;
        deny  all;

        # 보안 헤더 (security-patterns.md §보안 헤더 규칙)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Cache-Control          "no-store" always;

        location /health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local policy_ver = ngx.shared.luagate_policy:get("http:active_version") or "none"
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"status":"ok","policy_version":"' .. policy_ver .. '"}')
            }
        }

        location /api/ {
            default_type application/json;
            content_by_lua_block {
                -- ADR-004 §6.2: Bearer token 인증 (스텁 — 실제 구현은 향후 이슈)
                local auth = ngx.req.get_headers()["Authorization"]
                if not auth or not auth:match("^Bearer .+") then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    ngx.header["WWW-Authenticate"] = 'Bearer realm="luagate-admin"'
                    ngx.say('{"error":"Unauthorized"}')
                    return
                end
                -- Admin API endpoint stub: 향후 이슈에서 구현
                ngx.status = 501
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"error":"Not Implemented"}')
            }
        }

        location / {
            return 404;
        }
    }
}

# ── Stream 블록 (TCP 프록시 스텁) ────────────────────────────────────────
stream {
    # Stream context 전용 shared dict (http context와 별도 메모리 영역)
    lua_shared_dict luagate_policy          10m;
    lua_shared_dict luagate_stream_metrics   2m;
    lua_shared_dict luagate_connections      1m;

    log_format stream_basic '$remote_addr [$time_local] $protocol '
                            '$bytes_sent $bytes_received $session_time';
    access_log /dev/stdout stream_basic;

    upstream luagate_stream_upstream {
        server 127.0.0.1:9999;
    }

    server {
        listen 8443;

        preread_by_lua_block {
            -- Protocol detection + stream policy stub (future issue)
        }

        proxy_pass luagate_stream_upstream;

        log_by_lua_block {
            -- Stream session log stub (future issue)
        }
    }
}
