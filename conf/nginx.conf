worker_processes auto;
error_log  /dev/stderr warn;
pid        /var/run/openresty.pid;

# OpenResty: env 지시자 없이는 os.getenv()가 nil 반환
# admin-auth-contract.md §_token_source: LUAGATE_ADMIN_TOKEN 환경변수 사용
env LUAGATE_ADMIN_TOKEN;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    # 버전 정보 노출 차단 (Server 헤더, 에러 페이지)
    server_tokens off;

    # ── Lua 설정 ────────────────────────────────────────────────────────
    lua_code_cache on;
    lua_package_path  '/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/luagate/?.lua;;';
    lua_package_cpath '/usr/local/openresty/lualib/?.so;;';

    # ── Shared Dict Zones ────────────────────────────────────────────────
    # OpenResty: http 블록에 선언된 zone은 stream 컨텍스트에서도 접근 가능
    # stream 블록에 중복 선언하면 충돌 발생 → 모두 http 블록에 선언
    lua_shared_dict luagate_policy          10m;
    lua_shared_dict luagate_metrics          5m;
    lua_shared_dict luagate_stream_metrics   2m;
    lua_shared_dict luagate_connections      1m;
    lua_shared_dict luagate_state            1m;
    lua_shared_dict luagate_rate_limit       2m;

    # ── 초기화 (서버 기동 시 1회) ────────────────────────────────────────
    init_by_lua_block {
        require("luagate.policy.loader").init_load("conf/policies.yaml")
        local scanner_ok, scanner_err = require("luagate.scanner.ffi").init("conf/scanner-patterns")
        if not scanner_ok then
            ngx.log(ngx.ERR, "[luagate] scanner init failed: ", tostring(scanner_err))
            -- fail-closed: prevent nginx startup if scanner init fails
            error("[luagate] scanner init failed: " .. tostring(scanner_err))
        end
    }

    # ── Nginx 변수 선언 (log_format에서 사용) ───────────────────────────
    # X-Request-ID 헤더가 있으면 그대로 사용, 없으면 $request_id
    map $http_x_request_id $luagate_request_id {
        default  $request_id;
        ~^.+$    $http_x_request_id;
    }

    map $request_uri $luagate_path_raw_default {
        ~^([^?]*) $1;
        default   $uri;
    }

    # ── 구조화 JSON 액세스 로그 ─────────────────────────────────────────
    # log/http.lua (log_by_lua)가 cjson.encode()로 완성된 JSON 한 줄을
    # $luagate_log_json에 저장한다. escape=json 중복 적용 금지 (log-schema.md §2, §8).
    log_format luagate_json '$luagate_log_json';

    access_log /dev/stdout luagate_json;

    # ── Upstream ─────────────────────────────────────────────────────────
    upstream luagate_upstream {
        server 127.0.0.1:9999;   # 로컬 테스트/개발용 기본값
        keepalive 32;
    }

    # ── 데이터 플레인 서버 (:8080) ───────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Nginx 변수 기본값 초기화 (nginx_core short-circuit에서도 27필드 채움)
        # rewrite_by_lua가 실행되면 실제 값으로 override된다 (http-pipeline.md §3).
        set $luagate_path_raw        $luagate_path_raw_default;
        set $luagate_path_normalized $uri;
        set $luagate_action          "allow";
        set $luagate_matched_rule    "null";
        set $luagate_decision_source "nginx_core";
        set $luagate_threat_type     "null";
        set $luagate_rule_name       "null";
        set $luagate_active_version  "none";
        set $luagate_request_state   "short_circuited";
        set $luagate_deny_reason     "null";
        set $luagate_threat_score    "null";
        set $luagate_worker_id       "0";
        set $luagate_src_ip          $remote_addr;
        set $luagate_query_string    $args;
        # nginx_core short-circuit(400/413/414) 또는 log_by_lua 미실행 경로에서도
        # access_log 스키마가 깨지지 않도록 27필드 fallback JSON을 유지한다.
        set $luagate_log_json        '{"timestamp":"$time_iso8601","request_id":"$luagate_request_id","src_ip":"$remote_addr","src_port":$remote_port,"dst_port":$server_port,"method":"$request_method","host":"","path_raw":"","path_normalized":"","query_string":"","http_version":"$server_protocol","user_agent":null,"content_length":null,"action":"$luagate_action","matched_rule_id":null,"deny_reason":null,"decision_source":"$luagate_decision_source","threat_type":null,"threat_score":null,"rule_name":null,"request_state":"$luagate_request_state","latency_ms":0,"upstream_latency_ms":null,"response_status":$status,"bytes_sent":$bytes_sent,"active_version":"$luagate_active_version","worker_id":$luagate_worker_id}';

        # 헬스체크 (정책 평가 없이 즉시 응답)
        location /health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local policy_ver = ngx.shared.luagate_policy:get("http:active_version") or "none"
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"status":"ok","policy_version":"' .. policy_ver .. '"}')
            }
        }

        location / {
            # ── 1. URL 정규화 (rewrite phase) ──────────────────────────
            rewrite_by_lua_block {
                require("luagate.http.handler").rewrite()
            }

            # ── 2. 정책 평가 (access phase) ────────────────────────────
            access_by_lua_block {
                require("luagate.http.handler").access()
            }

            # ── 3. 업스트림 프록시 ─────────────────────────────────────
            proxy_pass         http://luagate_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # $proxy_add_x_forwarded_for 대신 $remote_addr 직접 설정:
            # 클라이언트가 XFF 헤더를 주입해도 업스트림에서 신뢰할 수 없는 IP를 신뢰하지 않도록 방어.
            # ADR-004 §6.3b: XFF 헤더 조작 위협 완화.
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Request-ID      $luagate_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # ── 4. 로그 + 메트릭 (log phase) ──────────────────────────
            log_by_lua_block {
                require("luagate.http.handler").log_phase()
            }
        }
    }

    # ── Admin API 서버 (:9090) ───────────────────────────────────────────
    # ADR-004: 별도 server block으로 분리 — data plane 정책 평가 제외
    # ADR-004 §6.1: localhost 전용 바인딩 — 외부 네트워크 노출 금지
    server {
        listen 127.0.0.1:9090;
        server_name _;

        set $luagate_path_raw        $luagate_path_raw_default;
        set $luagate_path_normalized $uri;
        set $luagate_action          "allow";
        set $luagate_matched_rule    "null";
        set $luagate_decision_source "nginx_core";
        set $luagate_threat_type     "null";
        set $luagate_rule_name       "null";
        set $luagate_active_version  "none";
        set $luagate_request_state   "short_circuited";
        set $luagate_deny_reason     "null";
        set $luagate_threat_score    "null";
        set $luagate_worker_id       "0";
        set $luagate_src_ip          $remote_addr;
        set $luagate_query_string    $args;
        # nginx_core short-circuit(400/413/414) 또는 log_by_lua 미실행 경로에서도
        # access_log 스키마가 깨지지 않도록 27필드 fallback JSON을 유지한다.
        set $luagate_log_json        '{"timestamp":"$time_iso8601","request_id":"$luagate_request_id","src_ip":"$remote_addr","src_port":$remote_port,"dst_port":$server_port,"method":"$request_method","host":"","path_raw":"","path_normalized":"","query_string":"","http_version":"$server_protocol","user_agent":null,"content_length":null,"action":"$luagate_action","matched_rule_id":null,"deny_reason":null,"decision_source":"$luagate_decision_source","threat_type":null,"threat_score":null,"rule_name":null,"request_state":"$luagate_request_state","latency_ms":0,"upstream_latency_ms":null,"response_status":$status,"bytes_sent":$bytes_sent,"active_version":"$luagate_active_version","worker_id":$luagate_worker_id}';

        # ADR-004 §6.3b 강화 옵션 2: Nginx 레벨 IP allowlist
        allow 127.0.0.1;
        deny  all;

        # 보안 헤더 (security-patterns.md §보안 헤더 규칙)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Cache-Control          "no-store" always;

        location /health {
            access_log off;
            default_type application/json;
            content_by_lua_block {
                local policy_ver = ngx.shared.luagate_policy:get("http:active_version") or "none"
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"status":"ok","policy_version":"' .. policy_ver .. '"}')
            }
        }

        location /api/ {
            default_type application/json;
            content_by_lua_block {
                -- ADR-004 §6.2: Bearer token 인증 (스텁 — 실제 구현은 향후 이슈)
                -- 계약: admin-auth-contract.md
                -- 토큰 소스: LUAGATE_ADMIN_TOKEN 환경변수
                -- fail-closed: 환경변수 미설정 시 모든 요청 거부
                local expected_token = os.getenv("LUAGATE_ADMIN_TOKEN")
                local auth = ngx.req.get_headers()["Authorization"]
                local provided = ""
                if auth then
                    local prefix = "Bearer "
                    if auth:sub(1, #prefix) == prefix then
                        provided = auth:sub(#prefix + 1)
                    end
                end
                -- constant-time compare (fail-closed: expected_token 미설정 시 거부)
                local function ct_compare(a, b)
                    if type(a) ~= "string" or type(b) ~= "string" then return false end
                    if #a == 0 or #b == 0 then return false end
                    if #a ~= #b then return false end
                    local result = 0
                    for i = 1, #a do
                        result = bit.bor(result, bit.bxor(string.byte(a, i), string.byte(b, i)))
                    end
                    return result == 0
                end
                if not ct_compare(provided, expected_token) then
                    ngx.status = 401
                    ngx.header["Content-Type"] = "application/json"
                    -- 계약: WWW-Authenticate 헤더 미전송 (admin-auth-contract.md)
                    ngx.say('{"error":"Unauthorized","message":"Invalid or missing Bearer token"}')
                    return
                end
                -- TODO: 인증 실패/성공 시 감사 로그 미구현 (admin-auth-contract.md §_reject 요구)
                --       향후 lua/luagate/admin/auth.lua 분리 시 luagate.log.audit 모듈로 추가
                -- Admin API endpoint stub: 향후 이슈에서 구현
                ngx.status = 501
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"error":"Not Implemented"}')
            }
        }

        location / {
            return 404;
        }
    }
}

# ── Stream 블록 (TCP 프록시 스텁) ────────────────────────────────────────
stream {
    # lua_shared_dict는 http 블록에 선언 — stream에서 중복 선언 불필요

    log_format stream_basic '$remote_addr [$time_local] $protocol '
                            '$bytes_sent $bytes_received $session_time';
    access_log /dev/stdout stream_basic;

    upstream luagate_stream_upstream {
        server 127.0.0.1:9999;
    }

    server {
        listen 8443;

        preread_by_lua_block {
            -- Protocol detection + stream policy stub (future issue)
        }

        proxy_pass luagate_stream_upstream;

        log_by_lua_block {
            -- Stream session log stub (future issue)
        }
    }
}
