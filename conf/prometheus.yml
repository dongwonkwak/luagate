# Prometheus dev configuration for LuaGate
# Used with docker-compose prometheus service

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: luagate
    metrics_path: /metrics
    bearer_token: "${LUAGATE_ADMIN_TOKEN}"
    static_configs:
      - targets:
          - luagate:9090
