# Path Traversal patterns (OWASP CRS-inspired)
patterns:
  - threat_type: "path_traversal"
    rule_name: "path_traversal_dotdot"
    pattern: "(\\.\\.[\\\\\\x2f])"
    score: 0.9
  - threat_type: "path_traversal"
    rule_name: "path_traversal_encoded"
    pattern: "(?i)(%2e%2e[%2f%5c])"
    score: 0.9
  - threat_type: "path_traversal"
    rule_name: "path_traversal_unix"
    pattern: "(?i)(/etc/passwd|/etc/shadow|/proc/self)"
    score: 0.95
  - threat_type: "path_traversal"
    rule_name: "path_traversal_windows"
    pattern: "(?i)(c:\\\\windows\\\\)"
    score: 0.9
