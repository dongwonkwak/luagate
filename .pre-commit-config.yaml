repos:
  # ── pre-commit built-in hooks ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
        files: \.(yaml|yml)$
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ── Lua: StyLua ────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: stylua
        name: StyLua (Lua formatter check)
        language: system
        entry: stylua --check
        types: [file]
        files: \.(lua)$
        pass_filenames: true

  # ── Lua: luacheck ──────────────────────────────────────────────────────────
      - id: luacheck
        name: luacheck (Lua linter)
        language: system
        entry: luacheck
        types: [file]
        files: \.(lua)$
        pass_filenames: true

  # ── C: clang-format ────────────────────────────────────────────────────────
      - id: clang-format
        name: clang-format (C formatter check)
        language: system
        entry: clang-format --dry-run --Werror
        types_or: [c, c++]
        pass_filenames: true

  # ── Shell: shellcheck ──────────────────────────────────────────────────────
      - id: shellcheck
        name: shellcheck (shell linter)
        language: system
        entry: scripts/shellcheck-wrapper.sh
        types: [shell]
        pass_filenames: true

  # ── Markdown: markdownlint ─────────────────────────────────────────────────
      - id: markdownlint
        name: markdownlint
        language: system
        entry: scripts/markdownlint-wrapper.sh --config .markdownlint.yaml
        types: [markdown]
        pass_filenames: true

  # ── Secrets: detect-secrets ────────────────────────────────────────────────
      - id: detect-secrets
        name: detect-secrets (secret detection)
        language: system
        entry: scripts/detect-secrets-hook-wrapper.sh
        args: ["--baseline", ".secrets.baseline"]
        exclude: >-
          (?x)^(
            \.pre-commit-config\.yaml|
            tests/.*|
            docs/.*\.md
          )$
        pass_filenames: true

  # ── Frontend: prettier ────────────────────────────────────────────────────
      - id: prettier
        name: prettier (TypeScript/React/CSS format check)
        language: system
        entry: scripts/prettier-wrapper.sh
        types_or: [ts, tsx, css]
        files: ^(ui|mcp)/src/
        pass_filenames: true

  # ── Frontend: eslint ──────────────────────────────────────────────────────
      - id: eslint
        name: eslint (TypeScript/React lint)
        language: system
        entry: scripts/eslint-wrapper.sh
        types_or: [ts, tsx]
        files: ^ui/src/
        pass_filenames: true

# ── commit-msg hook ────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (commit message format)
        language: system
        entry: npx --no-install commitlint --edit
        stages: [commit-msg]
        pass_filenames: false

# ── pre-push hooks ─────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: test-unit
        name: Unit tests (busted)
        language: system
        entry: scripts/test-unit-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: luacheck-full
        name: luacheck (full project lint)
        language: system
        entry: scripts/luacheck-full-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: vitest
        name: vitest (UI unit tests)
        language: system
        entry: scripts/vitest-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: tsc-ui
        name: tsc -b (UI type check)
        language: system
        entry: scripts/tsc-ui-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: tsc-mcp
        name: tsc --noEmit (MCP type check)
        language: system
        entry: scripts/tsc-mcp-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: cargo-test
        name: cargo test (Rust unit tests)
        language: system
        entry: scripts/cargo-test-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (Rust lint)
        language: system
        entry: scripts/cargo-clippy-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: mcp-test
        name: MCP tests (tsc + npm test)
        language: system
        entry: scripts/mcp-test-wrapper.sh
        stages: [pre-push]
        pass_filenames: false

      - id: conf-change-warn
        name: conf/ change warning
        language: system
        entry: scripts/conf-change-wrapper.sh
        stages: [pre-push]
        pass_filenames: false
