# ── docker-compose.test.yml ────────────────────────────────────────────────
# 테스트 전용 Docker Compose — Test::Nginx 통합 테스트 실행
#
# 사용법:
#   make test-docker          (권장)
#   docker compose -f docker-compose.test.yml up --build --exit-code-from test
#
# DON-133: Docker 기반 Test::Nginx 테스트 환경
# ───────────────────────────────────────────────────────────────────────────

services:
  test:
    image: ${LUAGATE_TEST_IMAGE:-luagate-test:local}
    build:
      context: .
      dockerfile: Dockerfile.test
    # 소스를 실시간 마운트 — 이미지 재빌드 없이 테스트 코드 변경 반영
    volumes:
      - ./lua/luagate:/usr/local/openresty/lualib/luagate:ro
      - ./conf/nginx.conf:/luagate/conf/nginx.conf:ro
      - ./tests:/luagate/tests:ro
      - ./policies:/luagate/policies:ro
    working_dir: /luagate
    environment:
      - LUAGATE_ADMIN_TOKEN=${LUAGATE_ADMIN_TOKEN:-test-secret-token-for-integration}
      - TEST_NGINX_BINARY=/usr/local/openresty/bin/openresty
      - TEST_NGINX_LOG_LEVEL=${TEST_NGINX_LOG_LEVEL:-warn}
      - TEST_NGINX_WORKER_USER=nobody
      - TEST_NGINX_FAST_SHUTDOWN=1
      - TEST_NGINX_USE_HUP=1
      - TEST_HTTP_PROVE_ARGS=${TEST_HTTP_PROVE_ARGS:--r -v tests/integration/http/}
      # Test::Nginx가 임시 nginx 인스턴스를 띄울 때 사용하는 포트
      - TEST_NGINX_PORT=${TEST_NGINX_PORT:-1984}
      # tests/ 볼륨을 :ro로 마운트 시 t/servroot 생성 실패 방지
      - TEST_NGINX_SERVROOT=${TEST_NGINX_SERVROOT:-/tmp/nginx-test-servroot}
    # shard별 파일 단위 prove 인자를 주입할 수 있게 shell wrapper를 사용한다.
    command: ["sh", "-lc", "exec prove $${TEST_HTTP_PROVE_ARGS:--r -v tests/integration/http/}"]
