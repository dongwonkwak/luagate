# Run from repo root: docker compose -f mcp/tests/integration/docker-compose.yml up
services:
  luagate:
    build:
      context: ../../../
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      - LUAGATE_ADMIN_TOKEN=integration-test-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 2s
      timeout: 5s
      retries: 10

  mcp-test-runner:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../../../mcp:/app
    depends_on:
      luagate:
        condition: service_healthy
    environment:
      - LUAGATE_ADMIN_URL=http://luagate:9090
      - LUAGATE_ADMIN_TOKEN=integration-test-token
      - MCP_CLIENT_NAME=integration-test
    command: ["sh", "-c", "npm ci && npm run test:integration"]
